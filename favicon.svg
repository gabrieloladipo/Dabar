<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" fill="#0a0f1c"/>
  <!-- Gradient circle background -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)" opacity="0.2"/>
  <!-- Main design: DD letters -->
  <text x="50" y="65" font-family="'Space Grotesk', sans-serif" font-size="60" font-weight="700" fill="url(#grad1)" text-anchor="middle" dominant-baseline="middle">DD</text>
</svg>